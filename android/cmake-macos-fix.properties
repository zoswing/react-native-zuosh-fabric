# React Native ZuoSh Fabric - macOS CMake 修复配置
# 此文件包含针对 macOS 环境的特殊设置

# 禁用不兼容的构建特性
android.enableCmakeCompilerSettings=false
android.enableParallelJsonGen=false
android.enableLto=false

# 链接器设置 - 避免 gold 链接器 (macOS 不支持)
android.cmake.enableHardening=false
android.cmake.aapt2FromMavenOverride=

# 构建优化
android.enableR8.fullMode=false
android.enableBuildCache=true

# NDK 特定设置
android.ndkVersion=27.1.12297006
android.ndkPath=/Users/z/Library/Android/sdk/ndk/27.1.12297006
